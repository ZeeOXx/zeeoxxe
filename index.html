function size(){w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);const n=Math.min(80,Math.round(w*h/18000));P=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.6+.6}))}
function draw(){x.clearRect(0,0,w,h);if(!rm)for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1}
for(let i=0;i<P.length;i++){const a=P[i];x.fillStyle="rgba(196,181,253,.7)";x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill();for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<130){x.strokeStyle=`rgba(168,85,247,${(1-d/130)*.3})`;x.lineWidth=1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}}
if(!rm)requestAnimationFrame(draw)}
size();draw();addEventListener("resize",()=>{size();if(rm)draw()})})();
render();
addEventListener("load",()=>setTimeout(()=>$("#ld").classList.add("gone"),350));
</script>
